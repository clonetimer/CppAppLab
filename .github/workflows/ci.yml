name: CppAppLab CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cppapplab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: GCC Build and GoogleTest
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake gdb libgtest-dev
      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCPPAPPLAB_FETCH_GTEST=OFF
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: CLI smoke test
        run: |
          ./build/cppapplab --version
          ./build/cppapplab --help
      - name: Environment acceptance smoke test
        run: bash scripts/check_environment.sh

  sanitizers:
    name: GCC ASan and UBSan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libgtest-dev
      - name: Configure
        run: |
          cmake -S . -B build-sanitize \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCPPAPPLAB_FETCH_GTEST=OFF \
            -DCPPAPPLAB_ENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build-sanitize --parallel
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: ctest --test-dir build-sanitize --output-on-failure

  code-quality:
    name: Formatting and clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install quality tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libgtest-dev clang-format clang-tidy
      - name: Check formatting
        run: |
          find include src tests course/fixtures labs -type f \( -name '*.cpp' -o -name '*.hpp' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror
      - name: Configure with clang-tidy
        run: |
          cmake -S . -B build-quality \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCPPAPPLAB_FETCH_GTEST=OFF \
            -DCPPAPPLAB_ENABLE_CLANG_TIDY=ON
      - name: Build and test
        run: |
          cmake --build build-quality --parallel
          ctest --test-dir build-quality --output-on-failure
