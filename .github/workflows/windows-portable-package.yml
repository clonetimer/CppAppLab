name: CP7 Windows portable candidate

on:
  pull_request:
    paths:
      - 'packaging/windows/**'
      - 'scripts/package_windows_native.py'
      - 'scripts/verify_windows_toolchain_lock.py'
      - 'scripts/replay_windows_toolchain_lock.py'
      - 'scripts/audit_windows_redistribution.py'
      - 'tests/test_windows_redistribution_audit.py'
      - 'tests/test_windows_toolchain_replay.py'
      - 'tests/test_windows_toolchain_lock.py'
      - 'tests/test_windows_native_package.py'
      - 'tests/test_web_workbench_integration.py'
      - 'src/**'
      - 'include/**'
      - 'CMakeLists.txt'
      - 'course/**'
      - 'labs/**'
      - 'cmake/**'
      - 'web/**'
      - '.github/workflows/windows-portable-package.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cppapplab-portable-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-portable:
    name: Relocated Windows native learner ZIP (CI candidate)
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Prepare MSYS2 base and trusted keyring only (no native packages)
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay all exact signed UCRT64 archives against the frozen lock
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          python -m unittest discover -s web/server/tests -p 'test_wsl_handoff.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s web/server/tests -p 'test_source_transfer_status.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p 'test_windows_toolchain_lock.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p 'test_windows_toolchain_replay.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = Join-Path $env:RUNNER_TEMP 'cppapplab-native-package/acquisition-replay.json'
          python scripts/replay_windows_toolchain_lock.py --msys2-root $env:MSYS2_LOCATION --baseline packaging/windows/ucrt64-versions.json --lock packaging/windows/ucrt64-archives.json --output $report
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build the actual release learner engine
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $prefix = Join-Path $env:MSYS2_LOCATION 'ucrt64'
          $toolBin = Join-Path $prefix 'bin'
          $env:PATH = "$toolBin;$env:PATH"
          $build = Join-Path $env:RUNNER_TEMP 'cppapplab native release build'
          & (Join-Path $toolBin 'cmake.exe') -S . -B $build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DCPPAPPLAB_FETCH_GTEST=OFF -DCPPAPPLAB_WARNINGS_AS_ERRORS=ON "-DCMAKE_CXX_COMPILER=$toolBin/g++.exe" "-DCMAKE_MAKE_PROGRAM=$toolBin/ninja.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $toolBin 'cmake.exe') --build $build --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $build 'cppapplab.exe') --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Acquire checksum-pinned official embedded Python
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'python-3.14.10-embed-amd64.zip'
          Invoke-WebRequest -Uri 'https://www.python.org/ftp/python/3.14.10/python-3.14.10-embed-amd64.zip' -OutFile $archive
          $sha = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne '90905e64a840557d8c1bc4f5b74db3d7ee85e3ffb217611cac1c7813acea4159') {
            throw "Official embedded Python archive SHA-256 mismatch: $sha"
          }
      - name: Create native learner ZIP with exact installed versions and file hashes
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $build = Join-Path $env:RUNNER_TEMP 'cppapplab native release build'
          $binary = Join-Path $build 'cppapplab.exe'
          $pythonZip = Join-Path $env:RUNNER_TEMP 'python-3.14.10-embed-amd64.zip'
          $out = Join-Path $env:RUNNER_TEMP 'cppapplab-native-package'
          python -m py_compile scripts/package_windows_native.py packaging/windows/start-native.py tests/test_windows_native_package.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/package_windows_native.py --root . --binary $binary --msys2-root $env:MSYS2_LOCATION --python-zip $pythonZip --acquisition-report (Join-Path $out 'acquisition-replay.json') --output $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Extract and exercise all five packaged native courses using bundled tools
        shell: pwsh
        env:
          CPPAPPLAB_CI_EXCHANGE_OUTPUT: ${{ runner.temp }}/cppapplab-ci-source-exchange
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'cppapplab-native-package'
          $archives = @(Get-ChildItem -LiteralPath $out -Filter '*.zip' -File)
          if ($archives.Count -ne 1) { throw 'Expected one learner candidate ZIP.' }
          python tests/test_windows_native_package.py $archives[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload actual native HTTP source exchange (synthetic CI learner only)
        uses: actions/upload-artifact@v4
        with:
          name: cppapplab-native-source-exchange-${{ github.sha }}
          path: ${{ runner.temp }}/cppapplab-ci-source-exchange/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload verified internal CI candidate (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: cppapplab-windows-x64-portable-candidate-${{ github.sha }}
          path: |
            ${{ runner.temp }}/cppapplab-native-package/*.zip
            ${{ runner.temp }}/cppapplab-native-package/SHA256SUMS
            ${{ runner.temp }}/cppapplab-native-package/package-summary.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload frozen archive replay receipt
        uses: actions/upload-artifact@v4
        with:
          name: cppapplab-windows-acquisition-replay-${{ github.sha }}
          path: ${{ runner.temp }}/cppapplab-native-package/acquisition-replay.json
          if-no-files-found: error
          retention-days: 30

      - name: Collect exact-version source and license evidence (not release approval)
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          python -m unittest discover -s tests -p 'test_windows_redistribution_audit.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $out = Join-Path $env:RUNNER_TEMP 'cppapplab-native-package'
          python scripts/audit_windows_redistribution.py --root . --msys2-root $env:MSYS2_LOCATION --summary (Join-Path $out 'package-summary.json') --output (Join-Path $out 'redistribution-evidence.json')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path (Join-Path $out 'redistribution-evidence.json'))) { throw 'Missing redistribution evidence report' }
      - name: Upload source and license evidence for review
        uses: actions/upload-artifact@v4
        with:
          name: cppapplab-windows-redistribution-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/cppapplab-native-package/redistribution-evidence.json
          if-no-files-found: error
          retention-days: 30

  cross-os-source-replay:
    name: Actual Windows exported source to Linux (${{ matrix.ubuntu }})
    needs: windows-portable
    strategy:
      fail-fast: false
      matrix:
        ubuntu: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.ubuntu }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: cppapplab-native-source-exchange-${{ github.sha }}
          path: ${{ runner.temp }}/cppapplab-ci-source-exchange
      - name: Check identity of actual native export artifact
        working-directory: ${{ runner.temp }}/cppapplab-ci-source-exchange
        run: sha256sum -c SHA256SUMS
      - name: Install real Linux teaching toolchain
        run: |
          bash scripts/ci_prepare_ubuntu_apt.sh
          sudo apt-get -o Acquire::Retries=3 install -y build-essential cmake libgtest-dev
      - name: Build real Linux engine
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DCPPAPPLAB_FETCH_GTEST=OFF
          cmake --build build --parallel 2
      - name: Import exact native exported sources and run all 101 Linux contracts
        env:
          CPPAPPLAB_TEST_BINARY: ${{ github.workspace }}/build/cppapplab
          CPPAPPLAB_CI_EXCHANGE_FILE: ${{ runner.temp }}/cppapplab-ci-source-exchange/windows-source-exchange.json
          CPPAPPLAB_REQUIRE_WINDOWS_EXCHANGE: '1'
        run: python3 tests/test_web_workbench_integration.py RealEngineBrowserAcceptance.test_source_only_reuse_rechecks_all_foundations_on_linux
