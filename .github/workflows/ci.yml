name: CppAppLab CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_full_ubuntu_validation:
        description: "Opt in to the full GCC, ASan/UBSan and clang-tidy suite; installs build tools on the hosted Ubuntu runner."
        required: false
        type: boolean
        default: false
      run_offline_dependency_validation:
        description: "Opt in to the offline dependency bundle check; routine course CI does not download Ubuntu packages."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cppapplab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu-2204-compatibility:
    name: Ubuntu 22.04 source-build compatibility
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install C++ development toolchain
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y build-essential cmake git gdb libgtest-dev
      - name: Verify Ubuntu support matrix and toolchain
        run: |
          bash tests/test_ubuntu_support.sh
          bash scripts/check_environment.sh
      - name: Run first-use setup, build and platform tests
        run: bash scripts/quickstart.sh </dev/null
      - name: Verify learner entry points
        run: |
          ./build/cppapplab --version
          ./build/cppapplab guide
          bash -n scripts/cppapplab-wsl-launcher.sh
          bash -n scripts/quickstart.sh

  build-and-test:
    name: GCC Build and GoogleTest (${{ matrix.ubuntu }})
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.run_full_ubuntu_validation) }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.ubuntu }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          bash scripts/ci_prepare_ubuntu_apt.sh
          sudo apt-get -o Acquire::Retries=3 install -y build-essential cmake gdb libgtest-dev
      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCPPAPPLAB_FETCH_GTEST=OFF
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: CLI smoke test
        run: |
          bash tests/test_ubuntu_support.sh
          ./build/cppapplab --version
          ./build/cppapplab --help
          timeout 5s ./build/cppapplab </dev/null
          bash -n scripts/cppapplab-wsl-launcher.sh
          launcher_home="/tmp/cppapplab-launcher-home"
          test "$(HOME="$launcher_home" bash scripts/cppapplab-wsl-launcher.sh --test-normalize-path '~/work/CppAppLab')" = "$launcher_home/work/CppAppLab"
          test "$(HOME="$launcher_home" bash scripts/cppapplab-wsl-launcher.sh --test-normalize-path '~')" = "$launcher_home"
          test "$(HOME="$launcher_home" bash scripts/cppapplab-wsl-launcher.sh --test-normalize-path '/opt/CppAppLab')" = "/opt/CppAppLab"
          test "$(HOME="$launcher_home" bash scripts/cppapplab-wsl-launcher.sh --test-normalize-path '~/work/Cpp App Lab')" = "$launcher_home/work/Cpp App Lab"
          launcher_repo="$RUNNER_TEMP/cppapplab launcher checkout"
          mkdir -p "$launcher_repo/build"
          git -C "$launcher_repo" init -q
          git -C "$launcher_repo" remote add origin https://github.com/clonetimer/CppAppLab.git
          printf '#!/usr/bin/env bash\nprintf "CPPAPPLAB_LAUNCHER_SMOKE_OK\\n"\n' > "$launcher_repo/build/cppapplab"
          chmod +x "$launcher_repo/build/cppapplab"
          launcher_repo_base64="$(printf '%s' "$launcher_repo" | base64 -w0)"
          bash scripts/cppapplab-wsl-launcher.sh "$launcher_repo_base64" 0 | grep -Fq "CPPAPPLAB_LAUNCHER_SMOKE_OK"
          foreign_repo="$RUNNER_TEMP/cppapplab foreign checkout"
          mkdir -p "$foreign_repo"
          git -C "$foreign_repo" init -q
          git -C "$foreign_repo" remote add origin https://github.com/example/not-cppapplab.git
          foreign_repo_base64="$(printf '%s' "$foreign_repo" | base64 -w0)"
          if bash scripts/cppapplab-wsl-launcher.sh "$foreign_repo_base64" 0; then
            echo "[FAIL] Launcher accepted an unrelated Git checkout." >&2
            exit 1
          else
            launcher_status=$?
            test "$launcher_status" -eq 6
          fi
      - name: Build and test HTTP server reference workspace
        run: |
          cmake -S labs/w8/http-server/reference -B build-http-server-reference \
            -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-http-server-reference --parallel
          ctest --test-dir build-http-server-reference --output-on-failure --timeout 15
      - name: HTTP connection policy acceptance
        run: |
          cmake -S course/fixtures/w8/http-connection-policy -B build-http-connection-policy \
            -DCPPAPPLAB_HTTP_PROTOCOL_SOURCE_DIR="$GITHUB_WORKSPACE/labs/w8/http-protocol/reference" \
            -DCPPAPPLAB_ROUTER_SOURCE_DIR="$GITHUB_WORKSPACE/labs/w8/router/reference" \
            -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-http-connection-policy --parallel
          ctest --test-dir build-http-connection-policy --output-on-failure --timeout 10
      - name: HTTP Keep-Alive lifecycle acceptance
        run: |
          cmake -S course/fixtures/w8/http-keep-alive -B build-http-keep-alive \
            -DCPPAPPLAB_HTTP_SERVER_SOURCE_DIR="$GITHUB_WORKSPACE/labs/w8/http-server/reference" \
            -DCPPAPPLAB_ROUTER_SOURCE_DIR="$GITHUB_WORKSPACE/labs/w8/router/reference" \
            -DCPPAPPLAB_THREAD_POOL_SOURCE_DIR="$GITHUB_WORKSPACE/labs/w6/thread-pool/reference" \
            -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-http-keep-alive --parallel
          ctest --test-dir build-http-keep-alive --output-on-failure --timeout 20
      - name: HTTP connection guards acceptance
        run: |
          cmake -S course/fixtures/w8/http-connection-guards -B build-http-connection-guards \
            -DCPPAPPLAB_HTTP_SERVER_SOURCE_DIR="$GITHUB_WORKSPACE/labs/w8/http-server/reference" \
            -DCPPAPPLAB_ROUTER_SOURCE_DIR="$GITHUB_WORKSPACE/labs/w8/router/reference" \
            -DCPPAPPLAB_THREAD_POOL_SOURCE_DIR="$GITHUB_WORKSPACE/labs/w6/thread-pool/reference" \
            -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-http-connection-guards --parallel
          ctest --test-dir build-http-connection-guards --output-on-failure --timeout 15
      - name: HTTP graceful shutdown acceptance
        run: |
          cmake -S course/fixtures/w8/http-graceful-shutdown -B build-http-graceful-shutdown \
            -DCPPAPPLAB_HTTP_SERVER_SOURCE_DIR="$GITHUB_WORKSPACE/labs/w8/http-server/reference" \
            -DCPPAPPLAB_ROUTER_SOURCE_DIR="$GITHUB_WORKSPACE/labs/w8/router/reference" \
            -DCPPAPPLAB_THREAD_POOL_SOURCE_DIR="$GITHUB_WORKSPACE/labs/w6/thread-pool/reference" \
            -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-http-graceful-shutdown --parallel
          ctest --test-dir build-http-graceful-shutdown --output-on-failure --timeout 15
      - name: HTTP observability acceptance
        run: |
          cmake -S course/fixtures/w8/http-observability -B build-http-observability \
            -DCPPAPPLAB_HTTP_SERVER_SOURCE_DIR="$GITHUB_WORKSPACE/labs/w8/http-server/reference" \
            -DCPPAPPLAB_ROUTER_SOURCE_DIR="$GITHUB_WORKSPACE/labs/w8/router/reference" \
            -DCPPAPPLAB_THREAD_POOL_SOURCE_DIR="$GITHUB_WORKSPACE/labs/w6/thread-pool/reference" \
            -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-http-observability --parallel
          ctest --test-dir build-http-observability --output-on-failure --timeout 15
      - name: HTTP operational load acceptance
        run: |
          cmake -S course/fixtures/w8/http-operational -B build-http-operational \
            -DCPPAPPLAB_HTTP_SERVER_SOURCE_DIR="$GITHUB_WORKSPACE/labs/w8/http-server/reference" \
            -DCPPAPPLAB_ROUTER_SOURCE_DIR="$GITHUB_WORKSPACE/labs/w8/router/reference" \
            -DCPPAPPLAB_THREAD_POOL_SOURCE_DIR="$GITHUB_WORKSPACE/labs/w6/thread-pool/reference" \
            -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-http-operational --parallel
          ctest --test-dir build-http-operational --output-on-failure --timeout 25
      - name: W8 D6 learner task acceptance contracts
        run: |
          cmake -S course/fixtures/w8/http-connection-policy -B build-task-d6a \
            -DCPPAPPLAB_LEARNER_SOURCE_DIR="$GITHUB_WORKSPACE/labs/w8/router/reference" \
            -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-task-d6a --parallel
          ctest --test-dir build-task-d6a --output-on-failure --timeout 10

          cmake -S course/fixtures/w8/http-keep-alive -B build-task-d6b \
            -DCPPAPPLAB_LEARNER_SOURCE_DIR="$GITHUB_WORKSPACE/labs/w8/http-server/reference" \
            -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-task-d6b --parallel
          ctest --test-dir build-task-d6b --output-on-failure --timeout 15

          cmake -S course/fixtures/w8/http-connection-guards -B build-task-d6c \
            -DCPPAPPLAB_LEARNER_SOURCE_DIR="$GITHUB_WORKSPACE/labs/w8/http-server/reference" \
            -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-task-d6c --parallel
          ctest --test-dir build-task-d6c --output-on-failure --timeout 15

          cmake -S course/fixtures/w8/http-graceful-shutdown -B build-task-d6d1 \
            -DCPPAPPLAB_LEARNER_SOURCE_DIR="$GITHUB_WORKSPACE/labs/w8/http-server/reference" \
            -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-task-d6d1 --parallel
          ctest --test-dir build-task-d6d1 --output-on-failure --timeout 15

          cmake -S course/fixtures/w8/http-observability -B build-task-d6d2 \
            -DCPPAPPLAB_LEARNER_SOURCE_DIR="$GITHUB_WORKSPACE/labs/w8/http-server/reference" \
            -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-task-d6d2 --parallel
          ctest --test-dir build-task-d6d2 --output-on-failure --timeout 15

          cmake -S course/fixtures/w8/http-load-probe -B build-task-d6d3 \
            -DCPPAPPLAB_LEARNER_SOURCE_DIR="$GITHUB_WORKSPACE/labs/w8/http-load-probe/reference" \
            -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-task-d6d3 --parallel
          ctest --test-dir build-task-d6d3 --output-on-failure --timeout 20
      - name: W9 HTTP chunked transfer acceptance
        run: |
          cmake -S course/fixtures/w9/http-chunked -B build-w9-http-chunked \
            -DCPPAPPLAB_LEARNER_SOURCE_DIR="$GITHUB_WORKSPACE/labs/w9/http-chunked/reference" \
            -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-w9-http-chunked --parallel
          ctest --test-dir build-w9-http-chunked --output-on-failure --timeout 10
      - name: W9 request-target acceptance
        run: |
          cmake -S course/fixtures/w9/request-target -B build-w9-request-target \
            -DCPPAPPLAB_LEARNER_SOURCE_DIR="$GITHUB_WORKSPACE/labs/w9/request-target/reference" \
            -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-w9-request-target --parallel
          ctest --test-dir build-w9-request-target --output-on-failure --timeout 10
      - name: W9 secure static-root acceptance
        run: |
          cmake -S course/fixtures/w9/static-root -B build-w9-static-root \
            -DCPPAPPLAB_LEARNER_SOURCE_DIR="$GITHUB_WORKSPACE/labs/w9/static-root/reference" \
            -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-w9-static-root --parallel
          ctest --test-dir build-w9-static-root --output-on-failure --timeout 10
      - name: Environment acceptance smoke test
        run: bash scripts/check_environment.sh

  sanitizers:
    name: GCC ASan and UBSan (${{ matrix.ubuntu }})
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.run_full_ubuntu_validation) }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.ubuntu }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          bash scripts/ci_prepare_ubuntu_apt.sh
          sudo apt-get -o Acquire::Retries=3 install -y build-essential cmake libgtest-dev
      - name: Configure
        run: |
          cmake -S . -B build-sanitize \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCPPAPPLAB_FETCH_GTEST=OFF \
            -DCPPAPPLAB_ENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build-sanitize --parallel
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: ctest --test-dir build-sanitize --output-on-failure
      - name: Direct Router fixture sanitizer coverage
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          cmake -S course/fixtures/w8/router -B build-router-sanitize \
            -DCPPAPPLAB_LEARNER_SOURCE_DIR="$GITHUB_WORKSPACE/labs/w8/router/reference" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-router-sanitize --parallel
          ctest --test-dir build-router-sanitize --output-on-failure --timeout 15
      - name: Direct HTTP server fixture sanitizer coverage
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          cmake -S course/fixtures/w8/http-server -B build-http-server-sanitize \
            -DCPPAPPLAB_LEARNER_SOURCE_DIR="$GITHUB_WORKSPACE/labs/w8/http-server/reference" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-http-server-sanitize --parallel
          ctest --test-dir build-http-server-sanitize --output-on-failure --timeout 20
      - name: HTTP connection policy sanitizer coverage
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          cmake -S course/fixtures/w8/http-connection-policy -B build-http-connection-policy-sanitize \
            -DCPPAPPLAB_HTTP_PROTOCOL_SOURCE_DIR="$GITHUB_WORKSPACE/labs/w8/http-protocol/reference" \
            -DCPPAPPLAB_ROUTER_SOURCE_DIR="$GITHUB_WORKSPACE/labs/w8/router/reference" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-http-connection-policy-sanitize --parallel
          ctest --test-dir build-http-connection-policy-sanitize --output-on-failure --timeout 10
      - name: HTTP Keep-Alive lifecycle sanitizer coverage
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          cmake -S course/fixtures/w8/http-keep-alive -B build-http-keep-alive-sanitize \
            -DCPPAPPLAB_HTTP_SERVER_SOURCE_DIR="$GITHUB_WORKSPACE/labs/w8/http-server/reference" \
            -DCPPAPPLAB_ROUTER_SOURCE_DIR="$GITHUB_WORKSPACE/labs/w8/router/reference" \
            -DCPPAPPLAB_THREAD_POOL_SOURCE_DIR="$GITHUB_WORKSPACE/labs/w6/thread-pool/reference" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-http-keep-alive-sanitize --parallel
          ctest --test-dir build-http-keep-alive-sanitize --output-on-failure --timeout 30
      - name: HTTP connection guards sanitizer coverage
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          cmake -S course/fixtures/w8/http-connection-guards -B build-http-connection-guards-sanitize \
            -DCPPAPPLAB_HTTP_SERVER_SOURCE_DIR="$GITHUB_WORKSPACE/labs/w8/http-server/reference" \
            -DCPPAPPLAB_ROUTER_SOURCE_DIR="$GITHUB_WORKSPACE/labs/w8/router/reference" \
            -DCPPAPPLAB_THREAD_POOL_SOURCE_DIR="$GITHUB_WORKSPACE/labs/w6/thread-pool/reference" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-http-connection-guards-sanitize --parallel
          ctest --test-dir build-http-connection-guards-sanitize --output-on-failure --timeout 20
      - name: HTTP graceful shutdown sanitizer coverage
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          cmake -S course/fixtures/w8/http-graceful-shutdown -B build-http-graceful-shutdown-sanitize \
            -DCPPAPPLAB_HTTP_SERVER_SOURCE_DIR="$GITHUB_WORKSPACE/labs/w8/http-server/reference" \
            -DCPPAPPLAB_ROUTER_SOURCE_DIR="$GITHUB_WORKSPACE/labs/w8/router/reference" \
            -DCPPAPPLAB_THREAD_POOL_SOURCE_DIR="$GITHUB_WORKSPACE/labs/w6/thread-pool/reference" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-http-graceful-shutdown-sanitize --parallel
          ctest --test-dir build-http-graceful-shutdown-sanitize --output-on-failure --timeout 20
      - name: HTTP observability sanitizer coverage
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          cmake -S course/fixtures/w8/http-observability -B build-http-observability-sanitize \
            -DCPPAPPLAB_HTTP_SERVER_SOURCE_DIR="$GITHUB_WORKSPACE/labs/w8/http-server/reference" \
            -DCPPAPPLAB_ROUTER_SOURCE_DIR="$GITHUB_WORKSPACE/labs/w8/router/reference" \
            -DCPPAPPLAB_THREAD_POOL_SOURCE_DIR="$GITHUB_WORKSPACE/labs/w6/thread-pool/reference" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-http-observability-sanitize --parallel
          ctest --test-dir build-http-observability-sanitize --output-on-failure --timeout 20
      - name: HTTP operational load sanitizer coverage
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          cmake -S course/fixtures/w8/http-operational -B build-http-operational-sanitize \
            -DCPPAPPLAB_HTTP_SERVER_SOURCE_DIR="$GITHUB_WORKSPACE/labs/w8/http-server/reference" \
            -DCPPAPPLAB_ROUTER_SOURCE_DIR="$GITHUB_WORKSPACE/labs/w8/router/reference" \
            -DCPPAPPLAB_THREAD_POOL_SOURCE_DIR="$GITHUB_WORKSPACE/labs/w6/thread-pool/reference" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-http-operational-sanitize --parallel
          ctest --test-dir build-http-operational-sanitize --output-on-failure --timeout 30

      - name: W8 D6 learner task sanitizer contracts
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          cmake -S course/fixtures/w8/http-connection-policy -B build-task-d6a-sanitize \
            -DCPPAPPLAB_LEARNER_SOURCE_DIR="$GITHUB_WORKSPACE/labs/w8/router/reference" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-task-d6a-sanitize --parallel
          ctest --test-dir build-task-d6a-sanitize --output-on-failure --timeout 15

          cmake -S course/fixtures/w8/http-keep-alive -B build-task-d6b-sanitize \
            -DCPPAPPLAB_LEARNER_SOURCE_DIR="$GITHUB_WORKSPACE/labs/w8/http-server/reference" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-task-d6b-sanitize --parallel
          ctest --test-dir build-task-d6b-sanitize --output-on-failure --timeout 20

          cmake -S course/fixtures/w8/http-connection-guards -B build-task-d6c-sanitize \
            -DCPPAPPLAB_LEARNER_SOURCE_DIR="$GITHUB_WORKSPACE/labs/w8/http-server/reference" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-task-d6c-sanitize --parallel
          ctest --test-dir build-task-d6c-sanitize --output-on-failure --timeout 20

          cmake -S course/fixtures/w8/http-graceful-shutdown -B build-task-d6d1-sanitize \
            -DCPPAPPLAB_LEARNER_SOURCE_DIR="$GITHUB_WORKSPACE/labs/w8/http-server/reference" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-task-d6d1-sanitize --parallel
          ctest --test-dir build-task-d6d1-sanitize --output-on-failure --timeout 20

          cmake -S course/fixtures/w8/http-observability -B build-task-d6d2-sanitize \
            -DCPPAPPLAB_LEARNER_SOURCE_DIR="$GITHUB_WORKSPACE/labs/w8/http-server/reference" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-task-d6d2-sanitize --parallel
          ctest --test-dir build-task-d6d2-sanitize --output-on-failure --timeout 20

          cmake -S course/fixtures/w8/http-load-probe -B build-task-d6d3-sanitize \
            -DCPPAPPLAB_LEARNER_SOURCE_DIR="$GITHUB_WORKSPACE/labs/w8/http-load-probe/reference" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-task-d6d3-sanitize --parallel
          ctest --test-dir build-task-d6d3-sanitize --output-on-failure --timeout 25

      - name: W9 HTTP chunked transfer sanitizer coverage
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          cmake -S course/fixtures/w9/http-chunked -B build-w9-http-chunked-sanitize \
