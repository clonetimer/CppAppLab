name: One-time C++ formatter

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format
      - name: Format C++ files
        run: |
          find include src tests course/fixtures labs -type f \( -name '*.cpp' -o -name '*.hpp' \) -print0 \
            | xargs -0 clang-format -i
      - name: Commit formatted files
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add include src tests course/fixtures labs
            git commit -m "style: format W2 Todo implementation and fixtures"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
