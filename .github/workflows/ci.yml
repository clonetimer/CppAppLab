name: CppAppLab CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cppapplab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: GCC Build and GoogleTest
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake gdb libgtest-dev
      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCPPAPPLAB_FETCH_GTEST=OFF
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: CLI smoke test
        run: |
          ./build/cppapplab --version
          ./build/cppapplab --help
      - name: Build and test HTTP server reference workspace
        run: |
          cmake -S labs/w8/http-server/reference -B build-http-server-reference \
            -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-http-server-reference --parallel
          ctest --test-dir build-http-server-reference --output-on-failure --timeout 15
      - name: HTTP connection policy acceptance
        run: |
          cmake -S course/fixtures/w8/http-connection-policy -B build-http-connection-policy \
            -DCPPAPPLAB_HTTP_PROTOCOL_SOURCE_DIR="$GITHUB_WORKSPACE/labs/w8/http-protocol/reference" \
            -DCPPAPPLAB_ROUTER_SOURCE_DIR="$GITHUB_WORKSPACE/labs/w8/router/reference" \
            -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-http-connection-policy --parallel
          ctest --test-dir build-http-connection-policy --output-on-failure --timeout 10
      - name: Environment acceptance smoke test
        run: bash scripts/check_environment.sh

  sanitizers:
    name: GCC ASan and UBSan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libgtest-dev
      - name: Configure
        run: |
          cmake -S . -B build-sanitize \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCPPAPPLAB_FETCH_GTEST=OFF \
            -DCPPAPPLAB_ENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build-sanitize --parallel
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: ctest --test-dir build-sanitize --output-on-failure
      - name: Direct Router fixture sanitizer coverage
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          cmake -S course/fixtures/w8/router -B build-router-sanitize \
            -DCPPAPPLAB_LEARNER_SOURCE_DIR="$GITHUB_WORKSPACE/labs/w8/router/reference" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-router-sanitize --parallel
          ctest --test-dir build-router-sanitize --output-on-failure --timeout 15
      - name: Direct HTTP server fixture sanitizer coverage
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          cmake -S course/fixtures/w8/http-server -B build-http-server-sanitize \
            -DCPPAPPLAB_LEARNER_SOURCE_DIR="$GITHUB_WORKSPACE/labs/w8/http-server/reference" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-http-server-sanitize --parallel
          ctest --test-dir build-http-server-sanitize --output-on-failure --timeout 20
      - name: HTTP connection policy sanitizer coverage
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          cmake -S course/fixtures/w8/http-connection-policy -B build-http-connection-policy-sanitize \
            -DCPPAPPLAB_HTTP_PROTOCOL_SOURCE_DIR="$GITHUB_WORKSPACE/labs/w8/http-protocol/reference" \
            -DCPPAPPLAB_ROUTER_SOURCE_DIR="$GITHUB_WORKSPACE/labs/w8/router/reference" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-http-connection-policy-sanitize --parallel
          ctest --test-dir build-http-connection-policy-sanitize --output-on-failure --timeout 10

  code-quality:
    name: Formatting and clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install quality tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libgtest-dev clang-format clang-tidy
      - name: Check formatting and show exact diff
        run: |
          find include src tests course/fixtures labs -type f \( -name '*.cpp' -o -name '*.hpp' \) -print0 \
            | xargs -0 clang-format -i
          git diff --exit-code -- include src tests course/fixtures labs
      - name: Configure with clang-tidy
        run: |
          cmake -S . -B build-quality \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCPPAPPLAB_FETCH_GTEST=OFF \
            -DCPPAPPLAB_ENABLE_CLANG_TIDY=ON
      - name: Build and test
        run: |
          cmake --build build-quality --parallel
          ctest --test-dir build-quality --output-on-failure
      - name: Direct Router fixture clang-tidy coverage
        run: |
          cmake -S course/fixtures/w8/router -B build-router-quality \
            -DCPPAPPLAB_LEARNER_SOURCE_DIR="$GITHUB_WORKSPACE/labs/w8/router/reference" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_CLANG_TIDY=clang-tidy
          cmake --build build-router-quality --parallel
          ctest --test-dir build-router-quality --output-on-failure --timeout 15
      - name: Direct HTTP server fixture clang-tidy coverage
        run: |
          cmake -S course/fixtures/w8/http-server -B build-http-server-quality \
            -DCPPAPPLAB_LEARNER_SOURCE_DIR="$GITHUB_WORKSPACE/labs/w8/http-server/reference" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_CLANG_TIDY=clang-tidy
          cmake --build build-http-server-quality --parallel
          ctest --test-dir build-http-server-quality --output-on-failure --timeout 20
      - name: HTTP connection policy clang-tidy coverage
        run: |
          cmake -S course/fixtures/w8/http-connection-policy -B build-http-connection-policy-quality \
            -DCPPAPPLAB_HTTP_PROTOCOL_SOURCE_DIR="$GITHUB_WORKSPACE/labs/w8/http-protocol/reference" \
            -DCPPAPPLAB_ROUTER_SOURCE_DIR="$GITHUB_WORKSPACE/labs/w8/router/reference" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_CLANG_TIDY=clang-tidy
          cmake --build build-http-connection-policy-quality --parallel
          ctest --test-dir build-http-connection-policy-quality --output-on-failure --timeout 10
