  windows-launcher-syntax:
    name: Windows launcher syntax
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Parse PowerShell launcher
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/Start-CppAppLab.ps1').Path,
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | Format-List
            exit 1
          }
          if (-not (Test-Path 'Start-CppAppLab.cmd')) {
            throw 'The double-click launcher file is missing.'
          }
          if (-not (Test-Path 'scripts/cppapplab-wsl-launcher.sh')) {
            throw 'The WSL bootstrap script is missing.'
          }
      - name: Parse PowerShell launcher with Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/Start-CppAppLab.ps1').Path,
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | Format-List
            exit 1
          }
      - name: Exercise Windows-to-WSL command handoff
        shell: pwsh
        run: ./tests/windows-launcher-smoke.ps1
      - name: Check offline packaging shell syntax
        shell: pwsh
        run: |
          $bash = Join-Path $env:ProgramFiles 'Git\bin\bash.exe'
          $scripts = @(
            'scripts/package_release.sh',
            'scripts/smoke_learner_package.sh',
            'scripts/accept_learner_package_wsl.sh',
            'scripts/package_offline_dependencies.sh',
            'scripts/install_offline_dependencies.sh',
            'scripts/verify_offline_dependency_bundle.sh',
            'scripts/ci_prepare_ubuntu_snapshot.sh',
            'scripts/lib/ubuntu-support.sh',
            'tests/test_ubuntu_support.sh'
          )
          foreach ($script in $scripts) {
            & $bash -n $script
            if ($LASTEXITCODE -ne 0) { throw "Bash syntax check failed: $script" }
          }

  package-candidate:
    name: Build source and learner packages (Ubuntu ${{ matrix.ubuntu }})
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['22.04', '24.04']
    runs-on: ubuntu-${{ matrix.ubuntu }}
    env:
      CPPAPPLAB_PACKAGE_UBUNTU_VERSION: ${{ matrix.ubuntu }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Verify packaging toolchain
        run: |
          command -v g++
          command -v cmake
          command -v tar
          command -v gzip
          command -v sha256sum
      - name: Audit published learner course content (no installation)
        run: python3 tests/test_course_materials.py
      - name: Build relocatable learner CLI
        run: |
          cmake -S . -B build-release \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DCPPAPPLAB_FETCH_GTEST=OFF
          cmake --build build-release --parallel
      - name: Create source and learner packages
        run: |
          bash scripts/package_release.sh build-release/cppapplab dist
          (cd dist && sha256sum --check SHA256SUMS)
      - name: Smoke-test relocated learner package
        run: |
          learner_archive="$(find dist -maxdepth 1 -type f -name 'CppAppLab-learner-*.tar.gz' -print -quit)"
          test -n "$learner_archive"
          bash scripts/smoke_learner_package.sh "$learner_archive"
      - name: Upload package candidates
        uses: actions/upload-artifact@v4
        with:
          name: cppapplab-packages-ubuntu-${{ matrix.ubuntu }}-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/package-manifest.json
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  offline-dependency-candidate:
    name: Build and verify offline dependencies (Ubuntu ${{ matrix.ubuntu }}, no installation)
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.run_offline_dependency_validation) }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['22.04', '24.04']
    runs-on: ubuntu-${{ matrix.ubuntu }}
    env:
      CPPAPPLAB_UBUNTU_SNAPSHOT_ID: 20261112T000000Z
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Refresh package indexes from pinned Ubuntu snapshot (no package installation)
        run: bash scripts/ci_prepare_ubuntu_snapshot.sh
      - name: Verify preinstalled resolver tools and apt metadata
        run: |
          command -v apt-get
          command -v apt-cache
          command -v curl
          command -v dpkg-deb
          command -v python3
          command -v sha256sum
          apt-cache policy build-essential cmake git gdb libgtest-dev clang-format clang-tidy
          if [ -r /etc/apt/apt-mirrors.txt ]; then cat /etc/apt/apt-mirrors.txt; fi
          python3 tests/test_apt_uri_parser.py
          python3 -m py_compile packaging/resolve_apt_uris.py packaging/download_apt_uris.py scripts/build_local_apt_index.py
      - name: Resolve and download .deb closure without installing packages
        run: |
          bash scripts/package_offline_dependencies.sh dist
      - name: Verify archive, package metadata and local-only APT dry-run
        run: |
          archive="$(find dist -maxdepth 1 -type f -name 'CppAppLab-offline-deps-*.tar.gz' -print -quit)"
          test -n "$archive"
          bash scripts/verify_offline_dependency_bundle.sh "$archive"
      - name: Upload offline dependency candidate
        uses: actions/upload-artifact@v4
        with:
          name: cppapplab-offline-deps-ubuntu-${{ matrix.ubuntu }}-${{ github.sha }}
          path: |
            dist/CppAppLab-offline-deps-*.tar.gz
            dist/CppAppLab-offline-deps-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
