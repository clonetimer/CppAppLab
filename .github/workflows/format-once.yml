name: One-time W5 workflow-test formatter

on:
  push:
    branches:
      - feat/p3-w5-linux-systems

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y clang-format
      - run: clang-format -i tests/system_lab_workflow_test.cpp
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tests/system_lab_workflow_test.cpp
            git commit -m "style: format W5 workflow test"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
