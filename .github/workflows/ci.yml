  code-quality:
    name: Formatting and clang-tidy (${{ matrix.ubuntu }})
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.run_full_ubuntu_validation) }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.ubuntu }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install quality tools
        run: |
          bash scripts/ci_prepare_ubuntu_apt.sh
          sudo apt-get -o Acquire::Retries=3 install -y build-essential cmake libgtest-dev clang-format clang-tidy
      - name: Check repository-wide formatting (manual full validation)
        if: github.event_name == 'workflow_dispatch'
        run: |
          find include src tests course/fixtures labs -type f \( -name '*.cpp' -o -name '*.hpp' \) -print0 \
            | xargs -0 clang-format -i
          git diff --exit-code -- include src tests course/fixtures labs
      - name: Configure with clang-tidy
        run: |
          cmake -S . -B build-quality \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCPPAPPLAB_FETCH_GTEST=OFF \
            -DCPPAPPLAB_ENABLE_CLANG_TIDY=ON
      - name: Build and test
        run: |
          cmake --build build-quality --parallel
          ctest --test-dir build-quality --output-on-failure
