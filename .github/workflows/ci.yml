name: CppAppLab CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cppapplab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: GCC Build and GoogleTest
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libgtest-dev
      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCPPAPPLAB_FETCH_GTEST=OFF
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: CLI smoke test
        run: |
          ./build/cppapplab --version
          ./build/cppapplab --help

  sanitizers:
    name: GCC ASan and UBSan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libgtest-dev
      - name: Configure
        run: |
          cmake -S . -B build-sanitize \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCPPAPPLAB_FETCH_GTEST=OFF \
            -DCPPAPPLAB_ENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build-sanitize --parallel
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: ctest --test-dir build-sanitize --output-on-failure

  code-quality:
    name: Formatting and clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install quality tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libgtest-dev clang-format clang-tidy
      - name: Check formatting
        run: |
          find include src tests -type f \( -name '*.cpp' -o -name '*.hpp' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror
      - name: Configure with clang-tidy
        run: |
          cmake -S . -B build-quality \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCPPAPPLAB_FETCH_GTEST=OFF \
            -DCPPAPPLAB_ENABLE_CLANG_TIDY=ON
      - name: Build and test
        run: |
          cmake --build build-quality --parallel
          ctest --test-dir build-quality --output-on-failure


  format-preview:
    name: Apply clang-format and refresh CI
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format
      - name: Format C++ sources
        run: |
          find include src tests -type f \( -name '*.cpp' -o -name '*.hpp' \) -print0 \
            | xargs -0 clang-format -i
      - name: Commit formatter changes
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add include src tests
            git commit -m "style: apply clang-format to calculator task"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Dispatch CI for formatted commit
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace("refs/heads/", "");
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "ci.yml",
              ref: branch
            });
